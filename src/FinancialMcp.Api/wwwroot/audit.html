<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría · FinancialMcp</title>
    <style>
        /* ── Design tokens (mismos valores que dashboard.html/imports.html) ── */
        :root {
            --bg: #0f1117;
            --surface: #161b25;
            --surface2: #1e2535;
            --border: #2a3347;
            --text: #e2e8f4;
            --dim: #8b98b0;
            --faint: #4a5568;
            --green: #4ade80;
            --green-bg: #052e16;
            --red: #f87171;
            --red-bg: #2d0a0a;
            --amber: #fbbf24;
            --amber-bg: #2d1f07;
            --sans: -apple-system, system-ui, 'Segoe UI', sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

        body {
            background: var(--bg);
            color: var(--text);
            font: 14px/1.6 var(--sans);
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

            .topbar h1 { font-size: 16px; font-weight: 700 }
            .topbar a {
                color: var(--dim);
                text-decoration: none;
                font-size: 13px;
            }
                .topbar a:hover { color: var(--text) }

        .content { padding: 20px 24px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

            .panel-head h2 { font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .05em }

        .panel-body { padding: 16px }

        button {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 5px 12px;
            font: 13px var(--sans);
            cursor: pointer;
        }
            button:hover:not(:disabled) { background: #2a3348; border-color: #3a4560 }
            button:disabled { opacity: .35; cursor: not-allowed }
            button.soon { opacity: .5; cursor: not-allowed }

        .status-badge {
            display: inline-block;
            font-size: 11px;
            font-family: var(--mono);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
            .status-badge.status-ok { color: #b0eec8; background: var(--green-bg); border-color: var(--green) }
            .status-badge.status-err { color: #f0b0b0; background: var(--red-bg); border-color: var(--red) }

        /* ── Sección Estado: grilla simple clave/valor ── */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .status-field label {
            display: block;
            font-size: 10px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 4px;
        }
        .status-field .value { font-family: var(--mono); font-size: 14px }

        /* ── Bloques de texto de la auditoría -- exactamente lo que devuelve
           AuditReportService, sin reformatear su contenido ── */
        .report-block {
            white-space: pre-wrap;
            font-family: var(--mono);
            font-size: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            max-height: 480px;
            overflow-y: auto;
        }

        .empty, .loading {
            padding: 16px;
            text-align: center;
            color: var(--faint);
            font-size: 13px;
        }

        .actions-row { display: flex; gap: 10px; flex-wrap: wrap }

        /* ── Selector de período ── */
        .period-row {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            flex-wrap: wrap;
        }
        .period-field label {
            display: block;
            font-size: 10px;
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-bottom: 4px;
        }
        .period-field input[type="date"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 5px 8px;
            font: 13px var(--mono);
        }
        .period-shortcuts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
        button.shortcut { font-size: 12px; padding: 4px 10px }

        /* ── Estado de la auditoría: 4 estados posibles, cada uno con apariencia
           visual distinta -- "sin datos" NO es lo mismo que "correcta" ── */
        .state-banner {
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
            .state-banner h3 { font-size: 15px; margin-bottom: 4px }
            .state-banner p { font-size: 13px; opacity: .9 }
            .state-banner .status-grid { margin-top: 14px }
            .state-banner.state-empty { background: var(--surface2); color: var(--dim) }
            .state-banner.state-ok { background: var(--green-bg); border-color: var(--green); color: #b0eec8 }
            .state-banner.state-problems { background: var(--amber-bg); border-color: var(--amber); color: #f5d38a }
            .state-banner.state-error { background: var(--red-bg); border-color: var(--red); color: #f0b0b0 }

        /* ── Problemas encontrados: una categoría por <details>, expandible ── */
        #auditProblems details {
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
        }
            #auditProblems details:last-child { margin-bottom: 0 }
            #auditProblems summary {
                padding: 10px 12px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                color: var(--dim);
            }
            #auditProblems details[open] summary { border-bottom: 1px solid var(--border) }
            #auditProblems .report-block { border: none; border-radius: 0; max-height: 360px }

        .toast {
            font: 12px var(--mono);
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-block;
        }
            .toast.err { background: var(--red-bg); color: #f0b0b0; border: 1px solid var(--red) }
    </style>
</head>
<body>

    <header class="topbar">
        <h1>Centro de Auditoría</h1>
        <a href="/dashboard.html">← Dashboard</a>
    </header>

    <div class="content">

        <!-- 1. Estado (solo lectura) -->
        <div class="panel">
            <div class="panel-head"><h2>Estado</h2></div>
            <div class="panel-body" id="statusBody">
                <div class="loading">Cargando…</div>
            </div>
        </div>

        <!-- 2. Período -->
        <div class="panel">
            <div class="panel-head">
                <h2>Período</h2>
                <div id="auditToast"></div>
            </div>
            <div class="panel-body">
                <div class="period-row">
                    <div class="period-field">
                        <label for="fromInput">Desde</label>
                        <input type="date" id="fromInput">
                    </div>
                    <div class="period-field">
                        <label for="toInput">Hasta</label>
                        <input type="date" id="toInput">
                    </div>
                    <button id="btnRunAudit">Ejecutar auditoría</button>
                </div>
                <div class="period-shortcuts">
                    <button type="button" class="shortcut" data-shortcut="currentMonth">Mes actual</button>
                    <button type="button" class="shortcut" data-shortcut="previousMonth">Mes anterior</button>
                    <button type="button" class="shortcut" data-shortcut="last30">Últimos 30 días</button>
                    <button type="button" class="shortcut" data-shortcut="last90">Últimos 90 días</button>
                </div>
            </div>
        </div>

        <!-- 3. Estado de la auditoría (resultado de la última ejecución) -->
        <div class="panel">
            <div class="panel-head"><h2>Estado de la auditoría</h2></div>
            <div class="panel-body">
                <div class="empty" id="auditState">Todavía no se ejecutó la auditoría en esta sesión.</div>
            </div>
        </div>

        <!-- 4. Resumen -->
        <div class="panel">
            <div class="panel-head"><h2>Resumen</h2></div>
            <div class="panel-body">
                <div class="empty" id="auditSummary">Ejecutá la auditoría para ver esta sección.</div>
            </div>
        </div>

        <!-- 5. Problemas encontrados -->
        <div class="panel">
            <div class="panel-head"><h2>Problemas encontrados</h2></div>
            <div class="panel-body">
                <div class="empty" id="auditProblems">Ejecutá la auditoría para ver esta sección.</div>
            </div>
        </div>

        <!-- 6. Acciones -->
        <div class="panel">
            <div class="panel-head"><h2>Acciones</h2></div>
            <div class="panel-body actions-row">
                <button id="btnGoMovements">Ver movimientos</button>
                <button class="soon" id="btnGoInvestigations" disabled title="Todavía no existe una pantalla de investigaciones">Ver investigaciones</button>
            </div>
        </div>

    </div>

    <script>
        const API = '';

        // ── 1. Estado: GET /api/audit/status (solo lectura, no ejecuta la auditoría) ──

        async function loadStatus() {
            const body = document.getElementById('statusBody');
            try {
                const s = await getJson(`${API}/api/audit/status`);
                body.innerHTML = `
                    <div class="status-grid">
                        <div class="status-field">
                            <label>Base de datos</label>
                            <div class="value"><span class="status-badge ${s.databaseConnected ? 'status-ok' : 'status-err'}">${s.databaseConnected ? 'Conectada' : 'Sin conexión'}</span></div>
                        </div>
                        <div class="status-field">
                            <label>Última importación</label>
                            <div class="value">${s.lastImport ? `${esc(shortFileName(s.lastImport.sourceFile))} — ${formatDateTime(s.lastImport.completedAtUtc)}` : 'Sin importaciones'}</div>
                        </div>
                        <div class="status-field">
                            <label>Movimientos (mes en curso)</label>
                            <div class="value">${s.movementsAnalyzed}</div>
                        </div>
                        <div class="status-field">
                            <label>Pendientes</label>
                            <div class="value">${s.pending}</div>
                        </div>
                        <div class="status-field">
                            <label>Clasificados</label>
                            <div class="value">${s.classified}</div>
                        </div>
                    </div>`;
            } catch (e) {
                body.innerHTML = `<div class="empty">No se pudo cargar el estado: ${esc(e.message)}</div>`;
            }
        }

        // ── Selector de período: los accesos rápidos solo completan Desde/Hasta --
        // el usuario siempre puede editarlos a mano antes de ejecutar. Sin "Todo el
        // historial" por ahora: sin paginación, auditar todo el histórico puede ser
        // costoso (ver AuditReportService, corre IClassificationSuggestionService por
        // cada movimiento clasificado del período). ──

        function setPeriod(from, to) {
            document.getElementById('fromInput').valueAsDate = from;
            document.getElementById('toInput').valueAsDate = to;
        }

        function applyShortcut(name) {
            const now = new Date();
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));

            if (name === 'currentMonth') {
                setPeriod(new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1)), today);
            } else if (name === 'previousMonth') {
                const from = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth() - 1, 1));
                const to = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 0));
                setPeriod(from, to);
            } else if (name === 'last30') {
                const from = new Date(today);
                from.setUTCDate(from.getUTCDate() - 29);
                setPeriod(from, today);
            } else if (name === 'last90') {
                const from = new Date(today);
                from.setUTCDate(from.getUTCDate() - 89);
                setPeriod(from, today);
            }
        }

        document.querySelectorAll('.shortcut').forEach(btn => {
            btn.addEventListener('click', () => applyShortcut(btn.dataset.shortcut));
        });

        // ── 3/4/5. Auditoría: GET /api/audit/report?from=&to= -- devuelve los mismos
        // números y bloques de texto que ya calcula AuditReportService (la misma
        // lógica que la tool MCP AuditDatabase) para el período que haya en el
        // selector, ya estructurados -- sin que el cliente tenga que parsear ningún
        // texto ni buscar marcadores. ──

        // Los 4 estados posibles, en el orden de la spec: sin datos NO es lo mismo
        // que "correcta" (0 movimientos analizados no implica 0 problemas).
        function renderState(data) {
            const el = document.getElementById('auditState');
            let cls, title, message;

            if (data.movementsAnalyzed === 0) {
                cls = 'state-empty';
                title = 'Sin datos';
                message = 'No existen movimientos dentro del período seleccionado. Elegí otro período o importá movimientos para este rango.';
            } else if (data.totalProblems === 0) {
                cls = 'state-ok';
                title = 'Correcta';
                message = `Se analizaron ${data.movementsAnalyzed} movimiento(s). No se detectaron inconsistencias.`;
            } else {
                cls = 'state-problems';
                title = 'Con problemas';
                message = `Se analizaron ${data.movementsAnalyzed} movimiento(s). Se encontraron ${data.totalProblems} elemento(s) que requieren revisión.`;
            }

            el.className = `state-banner ${cls}`;
            el.innerHTML = `
                <h3>${esc(title)}</h3>
                <p>${esc(message)}</p>
                <div class="status-grid">
                    <div class="status-field"><label>Desde</label><div class="value">${esc(data.from)}</div></div>
                    <div class="status-field"><label>Hasta</label><div class="value">${esc(data.to)}</div></div>
                    <div class="status-field"><label>Movimientos analizados</label><div class="value">${data.movementsAnalyzed}</div></div>
                </div>`;
        }

        function renderStateError(message) {
            const el = document.getElementById('auditState');
            el.className = 'state-banner state-error';
            el.innerHTML = `<h3>Error técnico</h3><p>La auditoría no pudo ejecutarse: ${esc(message)}</p>`;
        }

        function renderSummary(data) {
            const el = document.getElementById('auditSummary');
            el.className = 'status-grid';
            el.innerHTML = `
                <div class="status-field"><label>Movimientos analizados</label><div class="value">${data.movementsAnalyzed}</div></div>
                <div class="status-field"><label>Pendientes</label><div class="value">${data.pending}</div></div>
                <div class="status-field"><label>Clasificados</label><div class="value">${data.classified}</div></div>
                <div class="status-field"><label>Grupos sospechosos</label><div class="value">${data.suspiciousGroups}</div></div>
                <div class="status-field"><label>Movimientos posiblemente mal clasificados</label><div class="value">${data.misclassified}</div></div>
                <div class="status-field"><label>Investigaciones abiertas</label><div class="value">${data.openInvestigations}</div></div>
                <div class="status-field"><label>Investigaciones resueltas</label><div class="value">${data.resolvedInvestigations}</div></div>`;
        }

        // Mismo orden de prioridad que "Acciones recomendadas": grupos sospechosos,
        // pendientes, clasificaciones dudosas, investigaciones abiertas.
        function renderProblems(data) {
            const el = document.getElementById('auditProblems');
            el.className = '';
            el.innerHTML = `
                <details ${data.suspiciousGroups > 0 ? 'open' : ''}>
                    <summary>Grupos sospechosos (${data.suspiciousGroups})</summary>
                    <div class="report-block">${esc(data.suspiciousText)}</div>
                </details>
                <details ${data.pending > 0 ? 'open' : ''}>
                    <summary>Pendientes (${data.pending})</summary>
                    <div class="report-block">${esc(data.pendingText)}</div>
                </details>
                <details ${data.misclassified > 0 ? 'open' : ''}>
                    <summary>Clasificaciones dudosas (${data.misclassified})</summary>
                    <div class="report-block">${esc(data.misclassifiedText)}</div>
                </details>
                <details ${data.openInvestigations > 0 ? 'open' : ''}>
                    <summary>Investigaciones abiertas (${data.openInvestigations})</summary>
                    <div class="report-block">${esc(data.investigationsText)}</div>
                </details>`;
        }

        async function runAudit() {
            const btn = document.getElementById('btnRunAudit');
            const stateEl = document.getElementById('auditState');
            const summaryEl = document.getElementById('auditSummary');
            const problemsEl = document.getElementById('auditProblems');

            const fromValue = document.getElementById('fromInput').value;
            const toValue = document.getElementById('toInput').value;
            if (!fromValue || !toValue) {
                showToast('auditToast', 'Elegí Desde y Hasta antes de ejecutar la auditoría.', 'err');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Ejecutando…';
            stateEl.className = 'loading';
            stateEl.textContent = 'Ejecutando auditoría…';
            summaryEl.className = 'loading';
            summaryEl.textContent = 'Ejecutando auditoría…';
            problemsEl.className = 'loading';
            problemsEl.textContent = 'Ejecutando auditoría…';

            try {
                const data = await getJson(`${API}/api/audit/report?from=${fromValue}&to=${toValue}`);
                renderState(data);
                renderSummary(data);
                renderProblems(data);
            } catch (e) {
                renderStateError(e.message);
                summaryEl.className = 'empty';
                summaryEl.textContent = 'No disponible: la auditoría no pudo ejecutarse.';
                problemsEl.className = 'empty';
                problemsEl.textContent = 'No disponible: la auditoría no pudo ejecutarse.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ejecutar auditoría';
            }
        }

        document.getElementById('btnRunAudit').addEventListener('click', runAudit);

        // ── 6. Acciones -- solo navegación, sin pantallas nuevas ──

        document.getElementById('btnGoMovements').addEventListener('click', () => {
            window.location.href = '/movements.html';
        });

        // ── Utils (mismo patrón que imports.html/dashboard.html) ──

        async function getJson(url) {
            const r = await fetch(url);
            if (!r.ok) {
                const d = await r.json().catch(() => null);
                const msg = typeof d === 'string' ? d : (d?.detail ?? d?.title ?? `${r.status} ${r.statusText}`);
                throw new Error(msg);
            }
            return r.json();
        }

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function showToast(elId, msg, type, ms = 3500) {
            const el = document.getElementById(elId);
            el.innerHTML = `<span class="toast ${type}">${esc(msg)}</span>`;
            setTimeout(() => { if (el) el.innerHTML = ''; }, ms);
        }

        function shortFileName(path) {
            if (!path) return '—';
            const parts = String(path).replaceAll('\\', '/').split('/');
            return parts[parts.length - 1] || path;
        }

        function formatDateTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso);
            return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // Precarga el período con "mes actual" para que el usuario vea algo elegido
        // de entrada, pero NO ejecuta la auditoría -- eso solo pasa al presionar
        // "Ejecutar auditoría" (la auditoría es siempre bajo demanda).
        applyShortcut('currentMonth');
        loadStatus();
    </script>
</body>
</html>
